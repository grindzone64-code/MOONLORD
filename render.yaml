services:
  - type: web
    name: moon-lord-control-unit
    runtime: node
    plan: free
    buildCommand: npm install && mkdir -p bin && (curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o bin/yt-dlp && chmod +x bin/yt-dlp || true)
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 10000

